<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Badge — neutral kit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:ital,wght@0,100..700;1,100..700&display=swap">
<!-- @arrtu/pieces -->
<link rel="stylesheet" href="../../npm/css/core/theme.css">
<link rel="stylesheet" href="../../npm/css/core/surface.css">
<link rel="stylesheet" href="../../npm/css/utils/ripple.css">
<link rel="stylesheet" href="../../npm/css/neutral/icon-button.css">
<link rel="stylesheet" href="../../npm/css/neutral/button.css">
<link rel="stylesheet" href="../../npm/css/neutral/badge.css">
<style>
:root {
  --piece-base-h: 248;
  --piece-s: 16%;
  --piece-a: 100%;
  --cursor-pointer: pointer;
  --cursor-default: default;
}
* { margin: 0; padding: 0; box-sizing: border-box; font-family: "Google Sans Flex", sans-serif; }
body { min-height: 100dvh; padding: 32px 24px; display: grid; gap: 48px; align-content: start; }
h1  { font-size: 22px; font-weight: 700; }
h2  { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
.num { display: grid; place-content: center; width: 18px; height: 18px; border-radius: 50%; font-size: 10px; font-weight: 700; }
.section { display: grid; gap: 14px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 24px; }
.header { display: flex; align-items: center; justify-content: space-between; }
.theme-hint { font-size: 11px; display: flex; align-items: center; gap: 8px; }

/* simula item de menu para seção inline */
.menu-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 8px 12px;
    border-radius: 4px;
    width: 220px;
}
</style>
<script src="../../npm/js/core/piece-css-generator.js"></script>
<script defer src="../../npm/js/utils/ripple.js"></script>
<script defer src="../../npm/js/core/toggle.js"></script>
<script defer src="../../npm/js/utils/badge.js"></script>
</head>
<body class="piece-surface piece-light background-color-auto-02 text-color-auto-20">

<div class="header">
  <h1>Badge — neutral kit</h1>
  <div class="theme-hint">
    <span class="piece-surface text-color-auto-14">light</span>
    <button id="theme-btn" class="piece-surface piece-icon-button piece-small piece-toggle
                                  background-color-auto-04 background-color-auto-06-hover
                                  background-color-auto-11-active text-color-auto-20 text-color-auto-00-active">
      <span class="piece-ripple"></span>
      <span class="material-symbols-rounded piece-icon piece-false" translate="no">dark_mode</span>
      <span class="material-symbols-rounded piece-icon piece-true"  translate="no">light_mode</span>
    </button>
    <span class="piece-surface text-color-auto-14">light</span>
  </div>
</div>

<!-- 1. Default — contador numérico -->
<div class="section">
  <h2 class="piece-surface text-color-auto-14">
    <span class="num piece-surface background-color-auto-05 text-color-auto-16">1</span>
    Default — contador numérico
  </h2>
  <div class="row">
    <button class="piece-surface piece-icon-button piece-medium
                   background-color-auto-04 background-color-auto-06-hover text-color-auto-20">
      <span class="piece-ripple"></span>
      <span class="material-symbols-rounded piece-icon" translate="no">notifications</span>
      <span class="piece-badge piece-surface background-color-auto-11 text-color-auto-00">3</span>
    </button>

    <button class="piece-surface piece-icon-button piece-medium
                   background-color-auto-04 background-color-auto-06-hover text-color-auto-20">
      <span class="piece-ripple"></span>
      <span class="material-symbols-rounded piece-icon" translate="no">mail</span>
      <span class="piece-badge piece-surface background-color-auto-11 text-color-auto-00">9</span>
    </button>

    <button class="piece-surface piece-icon-button piece-medium
                   background-color-auto-04 background-color-auto-06-hover text-color-auto-20">
      <span class="piece-ripple"></span>
      <span class="material-symbols-rounded piece-icon" translate="no">chat</span>
      <span class="piece-badge piece-surface background-color-auto-11 text-color-auto-00">1</span>
    </button>
  </div>
</div>

<!-- 2. Small — dot indicador -->
<div class="section">
  <h2 class="piece-surface text-color-auto-14">
    <span class="num piece-surface background-color-auto-05 text-color-auto-16">2</span>
    Small — dot indicador
  </h2>
  <div class="row">
    <button class="piece-surface piece-icon-button piece-medium
                   background-color-auto-04 background-color-auto-06-hover text-color-auto-20">
      <span class="piece-ripple"></span>
      <span class="material-symbols-rounded piece-icon" translate="no">notifications</span>
      <span class="piece-badge piece-small piece-surface background-color-auto-11"></span>
    </button>

    <button class="piece-surface piece-icon-button piece-medium
                   background-color-auto-04 background-color-auto-06-hover text-color-auto-20">
      <span class="piece-ripple"></span>
      <span class="material-symbols-rounded piece-icon" translate="no">mail</span>
      <span class="piece-badge piece-small piece-surface background-color-auto-11"></span>
    </button>
  </div>
</div>

<!-- 3. Large — texto e "99+" -->
<div class="section">
  <h2 class="piece-surface text-color-auto-14">
    <span class="num piece-surface background-color-auto-05 text-color-auto-16">3</span>
    Large — texto longo e 99+
  </h2>
  <div class="row">
    <button class="piece-surface piece-icon-button piece-medium
                   background-color-auto-04 background-color-auto-06-hover text-color-auto-20">
      <span class="piece-ripple"></span>
      <span class="material-symbols-rounded piece-icon" translate="no">notifications</span>
      <span class="piece-badge piece-large piece-surface background-color-auto-11 text-color-auto-00">12</span>
    </button>

    <button class="piece-surface piece-icon-button piece-medium
                   background-color-auto-04 background-color-auto-06-hover text-color-auto-20">
      <span class="piece-ripple"></span>
      <span class="material-symbols-rounded piece-icon" translate="no">mail</span>
      <span class="piece-badge piece-large piece-surface background-color-auto-11 text-color-auto-00">99+</span>
    </button>
  </div>
</div>

<!-- 4. Large com ícone -->
<div class="section">
  <h2 class="piece-surface text-color-auto-14">
    <span class="num piece-surface background-color-auto-05 text-color-auto-16">4</span>
    Large — ícone + texto
  </h2>
  <div class="row">
    <button class="piece-surface piece-icon-button piece-medium
                   background-color-auto-04 background-color-auto-06-hover text-color-auto-20">
      <span class="piece-ripple"></span>
      <span class="material-symbols-rounded piece-icon" translate="no">person</span>
      <span class="piece-badge piece-large piece-surface background-color-auto-11 text-color-auto-00">
        <span class="material-symbols-rounded piece-icon" translate="no">star</span>
        Pro
      </span>
    </button>

    <button class="piece-surface piece-icon-button piece-medium
                   background-color-auto-04 background-color-auto-06-hover text-color-auto-20">
      <span class="piece-ripple"></span>
      <span class="material-symbols-rounded piece-icon" translate="no">verified_user</span>
      <span class="piece-badge piece-large piece-surface background-color-auto-11 text-color-auto-00">
        <span class="material-symbols-rounded piece-icon" translate="no">verified</span>
        OK
      </span>
    </button>
  </div>
</div>

<!-- 5. Pill -->
<div class="section">
  <h2 class="piece-surface text-color-auto-14">
    <span class="num piece-surface background-color-auto-05 text-color-auto-16">5</span>
    Pill — labels de texto
  </h2>
  <div class="row">
    <button class="piece-surface piece-button piece-medium
                   background-color-auto-04 background-color-auto-06-hover text-color-auto-20">
      <span class="piece-ripple"></span>
      <span class="piece-label">Dashboard</span>
      <span class="piece-badge piece-large piece-pill piece-surface background-color-auto-11 text-color-auto-00">Novo</span>
    </button>

    <button class="piece-surface piece-button piece-medium
                   background-color-auto-04 background-color-auto-06-hover text-color-auto-20">
      <span class="piece-ripple"></span>
      <span class="piece-label">Componentes</span>
      <span class="piece-badge piece-large piece-pill piece-surface background-color-auto-05 text-color-auto-16">Beta</span>
    </button>

    <button class="piece-surface piece-button piece-medium
                   background-color-auto-04 background-color-auto-06-hover text-color-auto-20">
      <span class="piece-ripple"></span>
      <span class="piece-label">Analytics</span>
      <span class="piece-badge piece-large piece-pill piece-surface background-color-auto-05 text-color-auto-14">Em breve</span>
    </button>
  </div>
</div>

<!-- 6. Inline — fluxo normal -->
<div class="section">
  <h2 class="piece-surface text-color-auto-14">
    <span class="num piece-surface background-color-auto-05 text-color-auto-16">6</span>
    Inline — fluxo normal (exceção)
  </h2>
  <div style="display: grid; gap: 4px; width: fit-content;">
    <div class="menu-item piece-surface background-color-auto-03">
      <span class="piece-surface text-color-auto-20">Notificações</span>
      <span class="piece-badge piece-large piece-inline piece-surface background-color-auto-11 text-color-auto-00">12</span>
    </div>
    <div class="menu-item piece-surface background-color-auto-03">
      <span class="piece-surface text-color-auto-20">Mensagens</span>
      <span class="piece-badge piece-large piece-inline piece-surface background-color-auto-11 text-color-auto-00">3</span>
    </div>
    <div class="menu-item piece-surface background-color-auto-03">
      <span class="piece-surface text-color-auto-20">Atualizações</span>
      <span class="piece-badge piece-large piece-pill piece-inline piece-surface background-color-auto-05 text-color-auto-14">Em breve</span>
    </div>
  </div>
</div>

<script>
  document.getElementById('theme-btn').addEventListener('click', () => {
    document.body.classList.toggle('piece-dark');
    document.body.classList.toggle('piece-light');
  });
</script>
</body>
</html>

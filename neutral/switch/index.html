<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Switch — neutral kit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:ital,wght@0,100..700;1,100..700&display=swap">
<!-- @arrtu/pieces -->
<link rel="stylesheet" href="../../../npm/css/core/theme.css">
<link rel="stylesheet" href="../../../npm/css/core/surface.css">
<link rel="stylesheet" href="../../../npm/css/utils/ripple.css">
<link rel="stylesheet" href="../../../npm/css/neutral/icon-button.css">
<link rel="stylesheet" href="../../../npm/css/neutral/switch.css">
<style>
:root {
  --piece-h: 248;
  --piece-s: 16%;
  --piece-a: 100%;
  --cursor-pointer: pointer;
  --cursor-default: default;
}
* { margin: 0; padding: 0; box-sizing: border-box; font-family: "Google Sans Flex", sans-serif; }
body { min-height: 100dvh; padding: 32px 24px; display: grid; gap: 48px; align-content: start; }
h1  { font-size: 22px; font-weight: 700; }
h2  { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
.num { display: grid; place-content: center; width: 18px; height: 18px; border-radius: 50%; font-size: 10px; font-weight: 700; }
.section { display: grid; gap: 14px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; }
.header { display: flex; align-items: center; justify-content: space-between; }
.theme-hint { font-size: 11px; display: flex; align-items: center; gap: 8px; }
</style>
</head>
<body class="piece-surface piece-dark background-color-auto-02 text-color-auto-20">

<div class="header">
  <h1>Switch — neutral kit</h1>
  <div class="theme-hint">
    <span class="piece-surface text-color-auto-14">dark</span>
    <button id="theme-btn" class="piece-surface piece-icon-button piece-small piece-toggle background-color-auto-04 background-color-auto-06-hover background-color-auto-11-active text-color-auto-20 text-color-auto-00-active">
      <span class="piece-ripple"></span>
      <span class="material-symbols-rounded piece-icon piece-false" translate="no">dark_mode</span>
      <span class="material-symbols-rounded piece-icon piece-true"  translate="no">light_mode</span>
    </button>
    <span class="piece-surface text-color-auto-14">light</span>
  </div>
</div>

<!-- 1. Sem ícone -->
<div class="section">
  <h2 class="piece-surface text-color-auto-14">
    <span class="num piece-surface background-color-auto-05 text-color-auto-16">1</span>
    Sem ícone
  </h2>
  <div class="row">
    <button class="piece-switch piece-surface piece-toggle
                   background-color-auto-02 background-color-auto-11-active
                   border-color-auto-08    border-color-auto-11-active
                   ripple-color-auto-14    ripple-color-auto-02-active">
      <span class="piece-ripple"></span>
      <span class="piece-indicator piece-surface piece-parent
                   background-color-auto-12 background-color-auto-02-active
                   text-color-auto-02       text-color-auto-11-active"></span>
    </button>
  </div>
</div>

<!-- 2. Só ON — piece-true -->
<div class="section">
  <h2 class="piece-surface text-color-auto-14">
    <span class="num piece-surface background-color-auto-05 text-color-auto-16">2</span>
    Só ícone ON (piece-true)
  </h2>
  <div class="row">
    <button class="piece-switch piece-surface piece-toggle
                   background-color-auto-02 background-color-auto-11-active
                   border-color-auto-08    border-color-auto-11-active
                   ripple-color-auto-14    ripple-color-auto-02-active">
      <span class="piece-ripple"></span>
      <span class="piece-indicator piece-surface piece-parent
                   background-color-auto-12 background-color-auto-02-active
                   text-color-auto-02       text-color-auto-11-active">
        <span class="material-symbols-rounded piece-icon piece-true" translate="no">check</span>
      </span>
    </button>
  </div>
</div>

<!-- 3. Só OFF — piece-false -->
<div class="section">
  <h2 class="piece-surface text-color-auto-14">
    <span class="num piece-surface background-color-auto-05 text-color-auto-16">3</span>
    Só ícone OFF (piece-false)
  </h2>
  <div class="row">
    <button class="piece-switch piece-surface piece-toggle
                   background-color-auto-02 background-color-auto-11-active
                   border-color-auto-08    border-color-auto-11-active
                   ripple-color-auto-14    ripple-color-auto-02-active">
      <span class="piece-ripple"></span>
      <span class="piece-indicator piece-surface piece-parent
                   background-color-auto-12 background-color-auto-02-active
                   text-color-auto-02       text-color-auto-11-active">
        <span class="material-symbols-rounded piece-icon piece-false" translate="no">close</span>
      </span>
    </button>
  </div>
</div>

<!-- 4. Ambos — piece-false + piece-true -->
<div class="section">
  <h2 class="piece-surface text-color-auto-14">
    <span class="num piece-surface background-color-auto-05 text-color-auto-16">4</span>
    Ambos ícones (piece-false + piece-true)
  </h2>
  <div class="row">
    <button class="piece-switch piece-surface piece-toggle
                   background-color-auto-02 background-color-auto-11-active
                   border-color-auto-08    border-color-auto-11-active
                   ripple-color-auto-14    ripple-color-auto-02-active">
      <span class="piece-ripple"></span>
      <span class="piece-indicator piece-surface piece-parent
                   background-color-auto-12 background-color-auto-02-active
                   text-color-auto-02       text-color-auto-11-active">
        <span class="material-symbols-rounded piece-icon piece-false" translate="no">close</span>
        <span class="material-symbols-rounded piece-icon piece-true"  translate="no">check</span>
      </span>
    </button>
  </div>
</div>

<!-- 5. Disabled -->
<div class="section">
  <h2 class="piece-surface text-color-auto-14">
    <span class="num piece-surface background-color-auto-05 text-color-auto-16">5</span>
    Disabled
  </h2>
  <div class="row">
    <button class="piece-switch piece-surface piece-toggle piece-disabled
                   background-color-auto-02 background-color-auto-11-active
                   border-color-auto-08    border-color-auto-11-active
                   ripple-color-auto-14    ripple-color-auto-02-active">
      <span class="piece-ripple"></span>
      <span class="piece-indicator piece-surface piece-parent
                   background-color-auto-12 background-color-auto-02-active
                   text-color-auto-02       text-color-auto-11-active"></span>
    </button>

    <button class="piece-switch piece-surface piece-toggle piece-disabled piece-actived
                   background-color-auto-02 background-color-auto-11-active
                   border-color-auto-08    border-color-auto-11-active
                   ripple-color-auto-14    ripple-color-auto-02-active">
      <span class="piece-ripple"></span>
      <span class="piece-indicator piece-surface piece-parent
                   background-color-auto-12 background-color-auto-02-active
                   text-color-auto-02       text-color-auto-11-active"></span>
    </button>
  </div>
</div>

<script src="../../../npm/js/core/piece-css-generator.js"></script>
<script src="../../../npm/js/utils/ripple.js"></script>
<script src="../../../npm/js/core/disabled.js"></script>
<script src="../../../npm/js/core/toggle.js"></script>
<script>
  document.getElementById('theme-btn').addEventListener('click', () => {
    document.body.classList.toggle('piece-dark');
    document.body.classList.toggle('piece-light');
  });
</script>
</body>
</html>
